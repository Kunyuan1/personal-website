# Every check this repo has ever been reviewed against, run on every push.
#
# It ran on nobody's machine but the author's until now. Vercel builds the site
# on each PR, which catches a broken build and nothing else — not the 29
# simulation invariants, not the glyph subset, not the linter. The reviews in
# docs/reviews are full of things that were only found because someone thought
# to type one of these commands, and at least twice the thing found was a check
# that had quietly stopped checking: `tsconfig.json` excluded `scripts/` for the
# whole life of the harness, so a compile error in it shipped, and two ghost
# invariants could not fail at all.
#
# sim:report is the one that matters and the one that costs anything: 75
# simulated minutes across five fixed seeds plus the pinned rigs, about two
# minutes of wall clock. It is deterministic — fixed seeds, no wall-clock input
# — so a failure here is a real regression and not a flake.
name: checks

# Pull requests, plus main after a merge. Not every push to every branch: with
# `pull_request` on, that runs the whole thing twice for each push to an open
# PR, and the simulation is the expensive half.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # `node --experimental-strip-types` runs the .mts harness unbuilt, which
      # needs Node 22 or newer. Pinned to the major rather than to `latest` so
      # the harness is not silently run on a runtime nobody has measured it on.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Must come before the typecheck, and this is the step CI existed to
      # find. `next-env.d.ts` and `.next/types` are both gitignored and both
      # generated, so on any checkout that has not already been built there are
      # no declarations for image imports and no `LayoutProps` — `tsc --noEmit`
      # reports 14 errors that are not real (13 x TS2307, one TS2304). It has
      # only ever passed on a machine that had run `next dev` or `next build`
      # at some point, which is every machine anyone had run it on.
      - name: generate Next types
        run: npx next typegen

      # Ordered cheapest-first, so an obvious break reports in seconds rather
      # than after the simulation has run. Each step runs even if an earlier one
      # failed: one push should report every problem it has, not just the first.
      - name: typecheck
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: lint
        if: ${{ !cancelled() }}
        run: npx eslint .

      # Every Chinese glyph on the site must be in CJK_GLYPHS, because the Noto
      # Serif SC webfont is subset to exactly those. A missing one does not
      # error in the browser — it silently falls back or renders nothing.
      - name: glyph subset
        if: ${{ !cancelled() }}
        run: npm run check:glyphs

      - name: build
        if: ${{ !cancelled() }}
        run: npx next build

      # Last because it is the slowest, and non-negotiable: it exits non-zero if
      # any invariant fails. The full table is printed either way, so a run can
      # be diffed against the numbers recorded in docs/reviews.
      - name: simulation invariants
        if: ${{ !cancelled() }}
        run: npm run sim:report
